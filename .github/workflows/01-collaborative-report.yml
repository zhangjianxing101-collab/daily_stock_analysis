name: Collaborative A-share report

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: Report mode
        type: choice
        options: [postmarket]
        default: postmarket
        required: false
      force:
        description: Bypass only the delivery-window check
        type: boolean
        default: false
        required: false
      test_email:
        description: Send a test-marked email without creating a sent marker
        type: boolean
        default: false
        required: false
      preview_only:
        description: Generate report artifacts only; never send email
        type: boolean
        default: false
        required: false
      reconcile_sent:
        description: Record a verified in-doubt QQ delivery as sent without running the report
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: collaborative-report-postmarket
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve report context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE_INPUT: ${{ inputs.force }}
          TEST_EMAIL_INPUT: ${{ inputs.test_email }}
          PREVIEW_ONLY_INPUT: ${{ inputs.preview_only }}
          RECONCILE_SENT_INPUT: ${{ inputs.reconcile_sent }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              "30 8 * * 1-5") mode="postmarket" ;;
              *) exit 1 ;;
            esac
            # GitHub documents scheduled workflows as best-effort and may start
            # them well after their cron time. Keep the market-session checks,
            # but do not reject a valid scheduled run only because it was queued.
            force="true"
          else
            case "$MANUAL_MODE" in
              postmarket) mode="$MANUAL_MODE" ;;
              *) exit 1 ;;
            esac
            case "${FORCE_INPUT:-false}" in
              true|false) force="${FORCE_INPUT:-false}" ;;
              *) exit 1 ;;
            esac
          fi
          case "${TEST_EMAIL_INPUT:-false}" in
            true|false) test_email="${TEST_EMAIL_INPUT:-false}" ;;
            *) exit 1 ;;
          esac
          case "${PREVIEW_ONLY_INPUT:-false}" in
            true|false) preview_only="${PREVIEW_ONLY_INPUT:-false}" ;;
            *) exit 1 ;;
          esac
          case "${RECONCILE_SENT_INPUT:-false}" in
            true|false) reconcile_sent="${RECONCILE_SENT_INPUT:-false}" ;;
            *) exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "schedule" ] && [ "$reconcile_sent" = "true" ]; then
            exit 1
          fi
          if { [ "$test_email" = "true" ] || [ "$preview_only" = "true" ]; } && [ "$reconcile_sent" = "true" ]; then
            exit 1
          fi
          if [ "$test_email" = "true" ] && [ "$preview_only" = "true" ]; then exit 1; fi

          trading_date="$(TZ=Asia/Shanghai date +%F)"
          report_key="$trading_date-$mode"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'force=%s\n' "$force" >> "$GITHUB_OUTPUT"
          printf 'test_email=%s\n' "$test_email" >> "$GITHUB_OUTPUT"
          printf 'preview_only=%s\n' "$preview_only" >> "$GITHUB_OUTPUT"
          printf 'reconcile_sent=%s\n' "$reconcile_sent" >> "$GITHUB_OUTPUT"
          printf 'trading_date=%s\n' "$trading_date" >> "$GITHUB_OUTPUT"
          printf 'report_key=%s\n' "$report_key" >> "$GITHUB_OUTPUT"

      - name: Resolve report data session
        id: data_session
        env:
          MODE: ${{ steps.context.outputs.mode }}
          TRADING_DATE: ${{ steps.context.outputs.trading_date }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          from src.collaborative_report.models import ReportMode
          from src.collaborative_report.session import report_data_session

          trading_date = date.fromisoformat(os.environ["TRADING_DATE"])
          try:
              session = report_data_session(
                  ReportMode(os.environ["MODE"]),
                  trading_date,
                  datetime.now(ZoneInfo("Asia/Shanghai")),
              )
          except RuntimeError as exc:
              if str(exc) != "report date is not an XSHG session":
                  raise
              # Let the runner retain its successful non-trading-day skip.
              session = trading_date
          print(f"date={session.isoformat()}")
          print(f"artifact=market-snapshot-{session.isoformat()}")
          PY

      - name: Check external sent marker
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.context.outputs.mode }}
          REPORT_KEY: ${{ steps.context.outputs.report_key }}
          TEST_EMAIL: ${{ steps.context.outputs.test_email }}
          PREVIEW_ONLY: ${{ steps.context.outputs.preview_only }}
          RECONCILE_SENT: ${{ steps.context.outputs.reconcile_sent }}
        run: |
          set -euo pipefail
          already_sent=false
          duplicate_check=available
          sent_exists=false
          in_doubt_exists=false
          claim_exists=false
          delivery_action=deliver
          block_reason=""
          blocked_final_state=""
          blocked_exit=0
          mkdir -p .workflow-artifacts
          if [ "$TEST_EMAIL" = "false" ] && [ "$PREVIEW_ONLY" = "false" ]; then
            if artifacts="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=sent-$REPORT_KEY&per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' 2>/dev/null)"; then
              if printf '%s\n' "$artifacts" | grep -Fxq "sent-$REPORT_KEY"; then
                sent_exists=true
              fi
            else
              duplicate_check=unavailable
              delivery_action=blocked
              block_reason=actions_marker_query_unavailable
            fi
            if [ "$delivery_action" = "deliver" ] && [ "$sent_exists" = "false" ]; then
              if artifacts="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=in-doubt-$REPORT_KEY&per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' 2>/dev/null)"; then
                if printf '%s\n' "$artifacts" | grep -Fxq "in-doubt-$REPORT_KEY"; then
                  in_doubt_exists=true
                fi
              else
                duplicate_check=unavailable
                delivery_action=blocked
                block_reason=actions_marker_query_unavailable
              fi
            fi
            if [ "$delivery_action" = "deliver" ] && [ "$sent_exists" = "false" ] && [ "$in_doubt_exists" = "false" ]; then
              if artifacts="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=claim-$REPORT_KEY&per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' 2>/dev/null)"; then
                if printf '%s\n' "$artifacts" | grep -Fxq "claim-$REPORT_KEY"; then
                  claim_exists=true
                fi
              else
                duplicate_check=unavailable
                delivery_action=blocked
                block_reason=actions_marker_query_unavailable
              fi
            fi
          fi
          if [ "$delivery_action" = "deliver" ] && [ "$TEST_EMAIL" = "false" ] && [ "$PREVIEW_ONLY" = "false" ]; then
            if [ "$sent_exists" = "true" ]; then
              already_sent=true
            elif [ "$in_doubt_exists" = "true" ] && [ "$RECONCILE_SENT" = "true" ]; then
              delivery_action=reconcile
            elif [ "$in_doubt_exists" = "true" ]; then
              delivery_action=blocked
              block_reason=reconcile_required
            elif [ "$claim_exists" = "true" ]; then
              delivery_action=blocked
              block_reason=claim_reconcile_required
            elif [ "$RECONCILE_SENT" = "true" ]; then
              delivery_action=blocked
              block_reason=no_in_doubt_marker
            fi
          fi
          if [ "$delivery_action" = "blocked" ]; then
            blocked_exit=1
            if [ "$block_reason" = "reconcile_required" ] || [ "$block_reason" = "claim_reconcile_required" ]; then
              blocked_final_state=operator_action_required
            else
              blocked_final_state=hard_failure
            fi
            REPORT_KEY="$REPORT_KEY" BLOCK_REASON="$block_reason" BLOCKED_FINAL_STATE="$blocked_final_state" python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(".workflow-artifacts/diagnostic-manifest.json").write_text(
              json.dumps(
                  {
                      "report_key": os.environ["REPORT_KEY"],
                      "final_state": os.environ["BLOCKED_FINAL_STATE"],
                      "module_statuses": {},
                      "source_timestamps": {},
                      "warning_codes": [os.environ["BLOCK_REASON"]],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          fi
          printf 'already_sent=%s\n' "$already_sent" >> "$GITHUB_OUTPUT"
          printf 'duplicate_check=%s\n' "$duplicate_check" >> "$GITHUB_OUTPUT"
          printf 'sent_exists=%s\n' "$sent_exists" >> "$GITHUB_OUTPUT"
          printf 'in_doubt_exists=%s\n' "$in_doubt_exists" >> "$GITHUB_OUTPUT"
          printf 'claim_exists=%s\n' "$claim_exists" >> "$GITHUB_OUTPUT"
          printf 'delivery_action=%s\n' "$delivery_action" >> "$GITHUB_OUTPUT"
          printf 'block_reason=%s\n' "$block_reason" >> "$GITHUB_OUTPUT"
          printf 'blocked_final_state=%s\n' "$blocked_final_state" >> "$GITHUB_OUTPUT"
          printf 'blocked_exit=%s\n' "$blocked_exit" >> "$GITHUB_OUTPUT"

      - name: Prepare production delivery claim
        id: claim_prepare
        if: ${{ steps.duplicate.outputs.delivery_action == 'deliver' && steps.context.outputs.test_email == 'false' && steps.context.outputs.preview_only == 'false' && steps.duplicate.outputs.already_sent == 'false' }}
        env:
          REPORT_KEY: ${{ steps.context.outputs.report_key }}
        run: |
          set -euo pipefail
          mkdir -p .workflow-artifacts
          REPORT_KEY="$REPORT_KEY" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          Path(".workflow-artifacts/claim-marker.json").write_text(
              json.dumps(
                  {
                      "report_key": os.environ["REPORT_KEY"],
                      "state": "claimed",
                      "timestamp": datetime.now(timezone.utc).isoformat(),
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload production delivery claim
        id: claim
        if: ${{ steps.duplicate.outputs.delivery_action == 'deliver' && steps.context.outputs.test_email == 'false' && steps.context.outputs.preview_only == 'false' && steps.duplicate.outputs.already_sent == 'false' }}
        uses: actions/upload-artifact@v6
        with:
          name: claim-${{ steps.context.outputs.report_key }}
          path: .workflow-artifacts/claim-marker.json
          include-hidden-files: true
          retention-days: 7

      - name: Record claim upload failure
        id: claim_failure
        if: ${{ failure() && steps.claim.outcome == 'failure' }}
        env:
          REPORT_KEY: ${{ steps.context.outputs.report_key }}
        run: |
          set -euo pipefail
          mkdir -p .workflow-artifacts
          REPORT_KEY="$REPORT_KEY" python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(".workflow-artifacts/diagnostic-manifest.json").write_text(
              json.dumps(
                  {
                      "report_key": os.environ["REPORT_KEY"],
                      "final_state": "hard_failure",
                      "module_statuses": {},
                      "source_timestamps": {},
                      "warning_codes": ["claim_upload_failed"],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          printf 'final_state=hard_failure\n' >> "$GITHUB_OUTPUT"
          printf 'exit_code=1\n' >> "$GITHUB_OUTPUT"

      - name: Extract prior sector state
        id: prior_sector
        if: ${{ steps.duplicate.outputs.delivery_action == 'deliver' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TRADING_DATE: ${{ steps.context.outputs.trading_date }}
        run: |
          set -euo pipefail
          prior_sector_state_path=""
          prior_sector_warning=prior_postmarket_sector_state_unavailable
          metadata_path=".workflow-artifacts/prior-sector-artifact-metadata.json"
          candidates_path=".workflow-artifacts/prior-sector-artifact-candidates.tsv"
          output_path=".workflow-artifacts/prior-sector-state.json"
          mkdir -p .workflow-artifacts

          if gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > "$metadata_path" 2>/dev/null; then
            METADATA_PATH="$metadata_path" CANDIDATES_PATH="$candidates_path" python - <<'PY'
          import json
          import os
          import re
          from datetime import date
          from pathlib import Path

          metadata_path = Path(os.environ["METADATA_PATH"])
          candidates_path = Path(os.environ["CANDIDATES_PATH"])
          current_trading_date = date.fromisoformat(os.environ["CURRENT_TRADING_DATE"])
          pattern = re.compile(r"^report-(\d{4}-\d{2}-\d{2})-postmarket$")
          try:
              pages = json.loads(metadata_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              pages = []

          candidates = []
          for page in pages if isinstance(pages, list) else []:
              for artifact in page.get("artifacts", ()) if isinstance(page, dict) else ():
                  if not isinstance(artifact, dict) or artifact.get("expired") is not False:
                      continue
                  artifact_name = artifact.get("name")
                  match = pattern.fullmatch(artifact_name) if isinstance(artifact_name, str) else None
                  if match is None:
                      continue
                  try:
                      trading_date = date.fromisoformat(match.group(1))
                  except ValueError:
                      continue
                  workflow_run = artifact.get("workflow_run")
                  artifact_id = str(artifact.get("id", ""))
                  run_id = str(workflow_run.get("id", "")) if isinstance(workflow_run, dict) else ""
                  created_at = artifact.get("created_at")
                  if (
                      trading_date >= current_trading_date
                      or trading_date.isoformat() != match.group(1)
                      or not artifact_id.isascii()
                      or not artifact_id.isdigit()
                      or not run_id.isascii()
                      or not run_id.isdigit()
                      or not isinstance(created_at, str)
                  ):
                      continue
                  candidates.append((trading_date, created_at, int(artifact_id), run_id, artifact_id, artifact_name))

          candidates_path.write_text(
              "".join(
                  f"{run_id}\t{artifact_id}\t{artifact_name}\t{trading_date.isoformat()}\n"
                  for trading_date, _, _, run_id, artifact_id, artifact_name
                  in sorted(candidates, reverse=True)[:5]
              ),
              encoding="utf-8",
          )
          PY
          fi

          if [ -f "$candidates_path" ]; then
            while IFS=$'\t' read -r run_id artifact_id artifact_name candidate_trading_date; do
              if ! [[ "$run_id" =~ ^[0-9]+$ && "$artifact_id" =~ ^[0-9]+$ ]]; then
                continue
              fi
              download_root=".workflow-artifacts/prior-sector-download/$artifact_id"
              mkdir -p "$download_root"
              if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$download_root" >/dev/null 2>&1; then
                continue
              fi
              PRIOR_DOWNLOAD_ROOT="$download_root" CANDIDATE_TRADING_DATE="$candidate_trading_date" OUTPUT_PATH="$output_path" python - <<'PY'
          import json
          import os
          from datetime import date
          from pathlib import Path

          root = Path(os.environ["PRIOR_DOWNLOAD_ROOT"]).resolve()
          output = Path(os.environ["OUTPUT_PATH"]).resolve()
          current_trading_date = date.fromisoformat(os.environ["CURRENT_TRADING_DATE"])
          expected_trading_date = date.fromisoformat(os.environ["CANDIDATE_TRADING_DATE"])
          for path in sorted(root.rglob("manifest.json")):
              try:
                  resolved = path.resolve(strict=True)
                  if not resolved.is_relative_to(root) or resolved.stat().st_size > 1_000_000:
                      continue
                  payload = json.loads(resolved.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  continue
              if not isinstance(payload, dict):
                  continue
              trading_date_text = payload.get("trading_date")
              try:
                  trading_date = date.fromisoformat(trading_date_text)
              except (TypeError, ValueError):
                  continue
              final_state = payload.get("final_state")
              test_email = payload.get("test_email")
              if not (
                  type(payload.get("schema_version")) is int
                  and payload["schema_version"] == 1
                  and trading_date == expected_trading_date
                  and trading_date < current_trading_date
                  and payload.get("report_key") == f"{trading_date.isoformat()}-postmarket"
                  and payload.get("mode") == "postmarket"
                  and final_state == "sent"
                  and test_email is False
                  and isinstance(payload.get("generated_at"), str)
                  and isinstance(payload.get("sector_state"), list)
              ):
                  continue
              sanitized = {
                  key: payload[key]
                  for key in (
                      "schema_version",
                      "report_key",
                      "mode",
                      "trading_date",
                      "generated_at",
                      "final_state",
                      "test_email",
                      "sector_state",
                  )
              }
              output.write_text(json.dumps(sanitized, ensure_ascii=False), encoding="utf-8")
              break
          PY
              if [ -f "$output_path" ]; then
                prior_sector_state_path="$output_path"
                prior_sector_warning=""
                break
              fi
            done < "$candidates_path"
          fi
          printf 'prior_sector_state_path=%s\n' "$prior_sector_state_path" >> "$GITHUB_OUTPUT"
          printf 'prior_sector_warning=%s\n' "$prior_sector_warning" >> "$GITHUB_OUTPUT"

      - name: Send latest archived postmarket test report
        id: archived
        if: ${{ github.event_name == 'workflow_dispatch' && steps.context.outputs.mode == 'postmarket' && steps.context.outputs.force == 'true' && steps.context.outputs.test_email == 'true' && steps.context.outputs.preview_only == 'false' && steps.duplicate.outputs.delivery_action == 'deliver' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD || secrets.QQEMAIL }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
        run: |
          printf 'final_state=hard_failure\nrunner_exit=1\nreport_key=unavailable\n' >> "$GITHUB_OUTPUT"
          set +e
          python scripts/send_archived_collaborative_report.py \
            --repository "$GITHUB_REPOSITORY" \
            --before "${{ steps.context.outputs.trading_date }}" \
            --output-dir .workflow-artifacts
          archived_exit=$?
          if [ "$archived_exit" -ne 0 ]; then
            printf 'runner_exit=%s\n' "$archived_exit" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Run collaborative report
        id: runner
        if: ${{ steps.archived.outcome == 'skipped' && steps.duplicate.outputs.delivery_action == 'deliver' && (steps.context.outputs.test_email == 'true' || steps.context.outputs.preview_only == 'true' || steps.duplicate.outputs.already_sent == 'true' || steps.claim.outcome == 'success') }}
        env:
          MODE: ${{ steps.context.outputs.mode }}
          FORCE: ${{ steps.context.outputs.force }}
          TEST_EMAIL: ${{ steps.context.outputs.test_email }}
          PREVIEW_ONLY: ${{ steps.context.outputs.preview_only }}
          REPORT_KEY: ${{ steps.context.outputs.report_key }}
          ALREADY_SENT: ${{ steps.duplicate.outputs.already_sent }}
          PRIOR_SECTOR_STATE_PATH: ${{ steps.prior_sector.outputs.prior_sector_state_path }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD || secrets.QQEMAIL }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          COLLAB_PORTFOLIO_JSON: ${{ secrets.COLLAB_PORTFOLIO_JSON }}
          THS_API_KEY: ${{ secrets.THS_API_KEY || secrets.THS }}
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEYS: ${{ secrets.ANTHROPIC_API_KEYS }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LLM_PRIMARY_API_KEY: ${{ secrets.LLM_PRIMARY_API_KEY }}
          LLM_PRIMARY_API_KEYS: ${{ secrets.LLM_PRIMARY_API_KEYS }}
          LLM_GEMINI_API_KEY: ${{ secrets.LLM_GEMINI_API_KEY }}
          LLM_GEMINI_API_KEYS: ${{ secrets.LLM_GEMINI_API_KEYS }}
          LLM_DEEPSEEK_API_KEY: ${{ secrets.LLM_DEEPSEEK_API_KEY }}
          LLM_DEEPSEEK_API_KEYS: ${{ secrets.LLM_DEEPSEEK_API_KEYS }}
          LLM_ANSPIRE_API_KEY: ${{ secrets.LLM_ANSPIRE_API_KEY }}
          LLM_ANSPIRE_API_KEYS: ${{ secrets.LLM_ANSPIRE_API_KEYS }}
          LLM_OPENAI_API_KEY: ${{ secrets.LLM_OPENAI_API_KEY }}
          LLM_OPENAI_API_KEYS: ${{ secrets.LLM_OPENAI_API_KEYS }}
          LLM_ANTHROPIC_API_KEY: ${{ secrets.LLM_ANTHROPIC_API_KEY }}
          LLM_ANTHROPIC_API_KEYS: ${{ secrets.LLM_ANTHROPIC_API_KEYS }}
          NEWS_INTEL_AUTO_FETCH_ENABLED: ${{ vars.NEWS_INTEL_AUTO_FETCH_ENABLED || 'true' }}
          NEWSNOW_BASE_URL: ${{ vars.NEWSNOW_BASE_URL || 'https://news.orz.ai/api/v1/dailynews' }}
          COLLAB_CAPITAL_CNY: ${{ vars.COLLAB_CAPITAL_CNY || '20000' }}
          COLLAB_RISK_FRACTION: ${{ vars.COLLAB_RISK_FRACTION || '0.02' }}
          COLLAB_SHORT_LIMIT: ${{ vars.COLLAB_SHORT_LIMIT || '5' }}
          COLLAB_SWING_LIMIT: ${{ vars.COLLAB_SWING_LIMIT || '5' }}
          COLLAB_SCREEN_PREFILTER: ${{ vars.COLLAB_SCREEN_PREFILTER || '120' }}
          GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || 'litellm' }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || 'gemini/gemini-2.5-flash' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-3-5-sonnet-20241022' }}
          LLM_PRIMARY_MODELS: ${{ vars.LLM_PRIMARY_MODELS || 'gemini-2.5-flash' }}
          LLM_GEMINI_MODELS: ${{ vars.LLM_GEMINI_MODELS || 'gemini-2.5-flash' }}
          LLM_DEEPSEEK_MODELS: ${{ vars.LLM_DEEPSEEK_MODELS || 'deepseek-chat' }}
          LLM_ANSPIRE_MODELS: ${{ vars.LLM_ANSPIRE_MODELS || 'Doubao-Seed-2.0-lite' }}
          LLM_OPENAI_MODELS: ${{ vars.LLM_OPENAI_MODELS || 'gpt-4.1-mini' }}
          LLM_ANTHROPIC_MODELS: ${{ vars.LLM_ANTHROPIC_MODELS || 'claude-3-5-sonnet-20241022' }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="reports/collaborative"
          mkdir -p .workflow-artifacts
          args=()
          args+=(--mode "$MODE")
          args+=(--output-dir "$OUTPUT_DIR")
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ "$TEST_EMAIL" = "true" ]; then
            args+=(--test-email)
          fi
          if [ "$PREVIEW_ONLY" = "true" ]; then
            args+=(--no-send)
          fi
          if [ "$ALREADY_SENT" = "true" ]; then
            args+=(--already-sent)
          fi
          if [ "$MODE" = "postmarket" ] && [ -n "$PRIOR_SECTOR_STATE_PATH" ]; then
            args+=(--prior-sector-report "$PRIOR_SECTOR_STATE_PATH")
          fi
          if [ "$MODE" = "postmarket" ]; then
            args+=(--market-snapshot-output ".workflow-artifacts/market-snapshot.json")
          fi

          set +e
          python - <<'PY' > .workflow-artifacts/preflight-result.json
          import json
          import sys

          code = None
          if sys.version_info < (3, 11):
              code = "runtime_python_incompatible"
          else:
              try:
                  import exchange_calendars  # noqa: F401
                  from src.collaborative_report.cli import main  # noqa: F401
              except (ImportError, ModuleNotFoundError):
                  code = "runtime_dependency_unavailable"
              except (SyntaxError, TypeError):
                  code = "runtime_python_incompatible"
              except Exception:
                  code = "runtime_bootstrap_failed"
          if code is not None:
              print(json.dumps({"error_code": code, "final_state": "hard_failure", "module_statuses": {}, "report_key": "unavailable"}, sort_keys=True))
              raise SystemExit(1)
          PY
          preflight_exit=$?
          if [ "$preflight_exit" -eq 0 ]; then
            python scripts/run_collaborative_report.py "${args[@]}" > .workflow-artifacts/runner-result.json 2> .workflow-artifacts/runner-stderr.log
            runner_exit=$?
          else
            cp .workflow-artifacts/preflight-result.json .workflow-artifacts/runner-result.json
            runner_exit=$preflight_exit
          fi
          set -e

          RUNNER_EXIT="$runner_exit" OUTPUT_DIR="$OUTPUT_DIR" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def safe_provider_diagnostics(stderr):
              patterns = (
                  r"A-share primary source: ths_(?:authentication_failed|configuration_missing|data_unavailable|network_failed|tls_failed|proxy_failed|connect_timeout|read_timeout|connection_failed|internal_failure|credential_encoding_failed|internal_type_error|internal_value_error|internal_attribute_error|permission_denied|rate_limited|unavailable)",
                  r"Daily bars stale: expected=\d{4}-\d{2}-\d{2} actual=\d{4}-\d{2}-\d{2}",
              )
              return sorted({line for line in stderr.splitlines() if any(re.fullmatch(pattern, line) for pattern in patterns)})

          result_path = Path(".workflow-artifacts/runner-result.json")
          try:
              result = json.loads(result_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              result = {}
          report_key = os.environ["REPORT_KEY"]
          final_state = result.get("final_state") if isinstance(result, dict) else None
          if not isinstance(final_state, str):
              final_state = "hard_failure"
          error_code = result.get("error_code") if isinstance(result, dict) else None
          if not isinstance(error_code, str):
              error_code = None
          channel = "test" if os.environ["TEST_EMAIL"] == "true" or os.environ.get("PREVIEW_ONLY") == "true" else "production"
          report_root = Path(os.environ["OUTPUT_DIR"]) / channel / report_key
          report_invalidated = error_code in {"report_clock_invalid", "snapshot_source_expired"}
          report_available = (
              not report_invalidated
              and report_root.is_dir()
              and any(report_root.glob("attempts/*/report.html"))
          )
          diagnostic = {
              "report_key": report_key,
              "final_state": final_state,
              "module_statuses": {},
              "source_timestamps": {},
              "warning_codes": [],
          }
          if error_code is not None:
              diagnostic["error_code"] = error_code
          try:
              stderr = Path(".workflow-artifacts/runner-stderr.log").read_text(encoding="utf-8")
          except (OSError, UnicodeError):
              stderr = ""
          diagnostic["provider_diagnostics"] = safe_provider_diagnostics(stderr)
          if report_root.is_dir():
              for manifest_path in sorted(report_root.glob("attempts/*/manifest.json"), reverse=True):
                  try:
                      manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  except (OSError, UnicodeError, json.JSONDecodeError):
                      continue
                  if not isinstance(manifest, dict) or manifest.get("report_key") != report_key:
                      continue
                  for key in ("module_statuses", "source_timestamps", "warning_codes"):
                      diagnostic[key] = manifest.get(key, diagnostic[key])
                  break
          artifact_dir = Path(".workflow-artifacts")
          (artifact_dir / "diagnostic-manifest.json").write_text(
              json.dumps(diagnostic, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          sent_marker = (
              os.environ["RUNNER_EXIT"] == "0"
              and final_state == "sent"
              and os.environ["TEST_EMAIL"] == "false"
          )
          if sent_marker:
              (artifact_dir / "sent-marker.json").write_text(
                  json.dumps({"final_state": "sent", "report_key": report_key}, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          needs_reconcile = (
              os.environ["TEST_EMAIL"] == "false"
              and final_state in {"in_doubt", "operator_action_required"}
          )
          if needs_reconcile:
              (artifact_dir / "in-doubt-marker.json").write_text(
                  json.dumps({"final_state": final_state, "report_key": report_key}, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"final_state={final_state}\n")
              output.write(f"report_available={'true' if report_available else 'false'}\n")
              output.write(f"report_channel={channel}\n")
              output.write(f"report_artifact_name={'test-report' if channel == 'test' else 'report'}-{report_key}\n")
              output.write(f"needs_reconcile={'true' if needs_reconcile else 'false'}\n")
              output.write(f"runner_exit={os.environ['RUNNER_EXIT']}\n")
          PY

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          try:
              diagnostic = json.loads(Path(".workflow-artifacts/diagnostic-manifest.json").read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              diagnostic = {"final_state": "hard_failure", "warning_codes": ["diagnostic_unavailable"]}
          print("## Report runner diagnostic")
          print("```json")
          print(json.dumps(diagnostic, ensure_ascii=False, sort_keys=True))
          print("```")
          PY

      - name: Reconcile verified in-doubt delivery
        id: reconcile
        if: ${{ steps.duplicate.outputs.delivery_action == 'reconcile' }}
        env:
          REPORT_KEY: ${{ steps.context.outputs.report_key }}
        run: |
          set -euo pipefail
          mkdir -p .workflow-artifacts
          REPORT_KEY="$REPORT_KEY" python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(".workflow-artifacts")
          (artifact_dir / "sent-marker.json").write_text(
              json.dumps({"final_state": "sent", "report_key": os.environ["REPORT_KEY"]}, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (artifact_dir / "diagnostic-manifest.json").write_text(
              json.dumps(
                  {
                      "report_key": os.environ["REPORT_KEY"],
                      "final_state": "reconciled_sent",
                      "module_statuses": {},
                      "source_timestamps": {},
                      "warning_codes": ["reconciled_after_operator_confirmation"],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          printf 'reconciled=true\n' >> "$GITHUB_OUTPUT"
          printf 'final_state=reconciled_sent\n' >> "$GITHUB_OUTPUT"
          printf 'exit_code=0\n' >> "$GITHUB_OUTPUT"

      - name: Upload private report
        if: ${{ always() && steps.runner.outputs.report_available == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.runner.outputs.report_artifact_name }}
          path: reports/collaborative/${{ steps.runner.outputs.report_channel }}/${{ steps.context.outputs.report_key }}
          retention-days: 7

      - name: Upload completed-session market snapshot
        if: ${{ always() && steps.context.outputs.mode == 'postmarket' && hashFiles('.workflow-artifacts/market-snapshot.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.data_session.outputs.artifact }}
          path: .workflow-artifacts/market-snapshot.json
          include-hidden-files: true
          retention-days: 7

      - name: Upload diagnostic manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: diagnostic-${{ steps.context.outputs.report_key }}
          path: .workflow-artifacts/diagnostic-manifest.json
          include-hidden-files: true
          retention-days: 7

      - name: Probe provider quality for previews
        if: ${{ steps.context.outputs.preview_only == 'true' }}
        timeout-minutes: 3
        continue-on-error: true
        env:
          THS_API_KEY: ${{ secrets.THS_API_KEY || secrets.THS }}
        run: python scripts/probe_collaborative_data.py > .workflow-artifacts/provider-quality.json 2> .workflow-artifacts/provider-private-stderr.log

      - name: Upload safe provider quality counts
        if: ${{ always() && steps.context.outputs.preview_only == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: provider-quality-${{ steps.context.outputs.report_key }}
          path: .workflow-artifacts/provider-quality.json
          include-hidden-files: true
          retention-days: 3

      - name: Upload sent marker
        if: ${{ always() && ((steps.runner.outputs.final_state == 'sent' && steps.context.outputs.test_email == 'false' && steps.runner.outputs.runner_exit == '0') || steps.reconcile.outputs.reconciled == 'true') }}
        uses: actions/upload-artifact@v6
        with:
          name: sent-${{ steps.context.outputs.report_key }}
          path: .workflow-artifacts/sent-marker.json
          include-hidden-files: true
          retention-days: 7

      - name: Upload in-doubt marker
        if: ${{ always() && steps.runner.outputs.needs_reconcile == 'true' && steps.context.outputs.test_email == 'false' }}
        uses: actions/upload-artifact@v6
        with:
          name: in-doubt-${{ steps.context.outputs.report_key }}
          path: .workflow-artifacts/in-doubt-marker.json
          include-hidden-files: true
          retention-days: 7

      - name: Write safe workflow summary
        if: ${{ always() }}
        env:
          REPORT_KEY: ${{ steps.context.outputs.report_key }}
          MODE: ${{ steps.context.outputs.mode }}
          FINAL_STATE: ${{ steps.archived.outputs.final_state || steps.runner.outputs.final_state || steps.duplicate.outputs.blocked_final_state || steps.claim_failure.outputs.final_state || steps.reconcile.outputs.final_state }}
          RUNNER_EXIT: ${{ steps.archived.outputs.runner_exit || steps.runner.outputs.runner_exit || steps.duplicate.outputs.blocked_exit || steps.claim_failure.outputs.exit_code || steps.reconcile.outputs.exit_code || '0' }}
          ARCHIVED_REPORT_KEY: ${{ steps.archived.outputs.report_key }}
          DUPLICATE_CHECK: ${{ steps.duplicate.outputs.duplicate_check }}
          DELIVERY_ACTION: ${{ steps.duplicate.outputs.delivery_action }}
          BLOCK_REASON: ${{ steps.duplicate.outputs.block_reason }}
          PRIOR_SECTOR_WARNING: ${{ steps.prior_sector.outputs.prior_sector_warning }}
        run: |
          {
            printf '## Collaborative report\n\n'
            printf -- '- report key: %s\n' "$REPORT_KEY"
            printf -- '- mode: %s\n' "$MODE"
            printf -- '- final state: %s\n' "$FINAL_STATE"
            printf -- '- runner exit: %s\n' "$RUNNER_EXIT"
            printf -- '- external duplicate check: %s\n' "$DUPLICATE_CHECK"
            printf -- '- delivery action: %s\n' "$DELIVERY_ACTION"
            if [ -n "$ARCHIVED_REPORT_KEY" ]; then
              printf -- '- archived report key: %s\n' "$ARCHIVED_REPORT_KEY"
            fi
            if [ -n "$BLOCK_REASON" ]; then
              printf -- '- delivery status: %s\n' "$BLOCK_REASON"
            fi
            if [ -n "$PRIOR_SECTOR_WARNING" ]; then
              printf -- '- prior sector state: %s\n' "$PRIOR_SECTOR_WARNING"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the runner failed
        if: ${{ always() }}
        env:
          RUNNER_EXIT: ${{ steps.archived.outputs.runner_exit || steps.runner.outputs.runner_exit || steps.duplicate.outputs.blocked_exit || steps.claim_failure.outputs.exit_code || steps.reconcile.outputs.exit_code || '0' }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_EXIT" -ne 0 ]; then
            exit "$RUNNER_EXIT"
          fi
